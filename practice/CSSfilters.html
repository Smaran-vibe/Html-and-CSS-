<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
</head>
<style>
      img{
       width:440px;
       height:400px;
       /* filter:blur(5px); */
  }
  .img1{
    filter: brightness(200%) contrast(1.5);
  }
  .img2{
    /* filter:grayscale(1); */
    filter:sepia(100%);
  }
  .img3{
    filter: grayscale(1);
    filter:invert(1);
  }
</style>

<body>
    <div class="container">
        <img class="img1" src="https://i.pinimg.com/736x/2f/fd/2a/2ffd2af47e1647ed1fe9cc3dd15aabc0.jpg" alt="KSI">
        <img class="img2"src="https://imgs.search.brave.com/wiLQkifnBtLnf0bVTHobi__o7f-gsjcda8jdXn3xZH0/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWFn/ZXMtbmEuc3NsLWlt/YWdlcy1hbWF6b24u/Y29tL2ltYWdlcy9H/LzAxL2N0dDIzMDlk/ODIzMDkvMjI2NTA3/Njc5NjE2MTg5OTA0/Mi5qcGc" alt="joji">
        <img class="img3"src="https://imgs.search.brave.com/NNt7LG25kSUBMFOm31iMShImqvWnh15T77tDmDKCwiA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pLmlt/Z2ZsaXAuY29tLzQv/MW0wNno0LmpwZw" alt="">
    </div>
    
</body>
</html>
