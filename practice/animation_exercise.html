<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy ball</title>
</head>
<style>
    .container {
        background-color: rgb(117, 117, 171);
        width: 80vw;
        height: 70vh;
        position: relative;
        
        
        
    }


    .item {
        background-color: yellow;
        width: 5vw;
        height: 10vh;
        border-radius: 52px;
        bottom: 0;
        left: 0;
        position:absolute;
        animation:bounce 3s linear infinite alternate-reverse;
      
                     
                         
        



    }

 

@keyframes bounce {
  0% {
    transform: translate(0px, 0px)scale(1.1, 0.9);
  }

  25% {
    transform: translate(200px, -150px);
  }

  35% {
    transform: translate(400px, 0px) scale(1.1, 0.9);
  }

  50% {
    transform: translate(600px, -140px);
  }

  75% {
    transform: translate(800px, 0px)scale(1.1, 0.9);
  }
  100%{
    transform: translate(1130px,-130px);
  }
}
</style>

<body>
    <div class="container">
        <div class="item"></div>
    </div>

</body>

</html>
